name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
    - uses: actions/checkout@v7
      with:
        # the plugin jar used by the tests embeds the version, computed from tags
        fetch-depth: 0
    - uses: coursier/cache-action@v9
    - name: Compile
      run: |
        ./mill dataClass._.test.testForked
        ./mill test.testProjV1._.compile
        ./mill test.testProjV2._.compile
        ./mill test.userProjV1._.compile
        ./mill test.compat._.test.testForked
        ./mill test.plugin._.test.testForked
        ./mill test.pluginUser._.testForked

  mima:
    runs-on: ubuntu-latest
    name: Binary compatibility
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v9
    - name: Check binary compatibility
      run: ./mill __.mimaReportBinaryIssues

  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v9
    - uses: coursier/setup-action@v3
      with:
        apps: scalafmt
    - name: Check formatting
      run: scalafmt --test

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # for GitHub Packages
      packages: write
    # Never publish to Sonatype Central from two jobs at a time. A job waits for the running one
    # rather than cancelling it (GitHub keeps only one waiting job per group though, and cancels
    # an older waiting one).
    concurrency:
      group: sonatype-central-publish-${{ github.repository }}
      cancel-in-progress: false
    env:
      # test.compat.*.dataClassModule are aliases of dataClass modules, keep them out
      PUBLISH_ARTIFACTS: "{dataClass,plugin}._.publishArtifacts"
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
    - uses: coursier/cache-action@v9
    - name: Release
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          # --shouldRelease false: the bundle is uploaded and validated on Sonatype Central, but has
          # to be published manually from https://central.sonatype.com/publishing/deployments
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --publishArtifacts "$PUBLISH_ARTIFACTS" --bundleName "data-class-${GITHUB_REF#refs/tags/v}" --shouldRelease false
        else
          for tag in $(git tag --points-at HEAD); do
            git tag -d "$tag"
          done
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --publishArtifacts "$PUBLISH_ARTIFACTS"
        fi
      env:
        MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
        MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
        MILL_SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
        MILL_SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
    # Best effort: Sonatype Central is the source of truth
    - name: Publish to GitHub Packages
      continue-on-error: true
      run: |
        ./mill -i mill.javalib.MavenPublishModule/publishAll \
          --publishArtifacts "$PUBLISH_ARTIFACTS" \
          --releaseUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY" \
          --snapshotUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY"
      env:
        MILL_MAVEN_USERNAME: ${{ github.actor }}
        MILL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
